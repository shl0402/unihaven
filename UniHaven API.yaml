  /api/accommodations/search/:
    get:
      operationId: accommodation_search
      description: "\n    Search accommodations with optional filters:\n    - campus_id:\
        \ Sort by distance from this campus\n    - max_price: Maximum monthly rent\
        \ in HKD\n    - min_beds: Minimum number of beds required\n    - type: Type\
        \ of accommodation (Room/Flat/Mini hall)\n    "
      summary: Search accommodations
      parameters:
      - in: query
        name: campus_id
        schema:
          type: integer
        description: Filter and sort by distance from this campus
        examples:
          HKUMainCampus:
            value: 11
            summary: HKU Main Campus
            description: Sort by distance from HKU main campus
          TheChineseUniversityOfHongKongCampus:
            value: 16
            summary: The Chinese University of Hong Kong Campus
            description: Sort by distance from The Chinese University of Hong Kong
              Campus
      - in: query
        name: max_price
        schema:
          type: number
          format: double
        description: Maximum monthly rent in HKD
        examples:
          Budget:
            value: 5000.0
            description: Find accommodations under $5000/month
      - in: query
        name: min_beds
        schema:
          type: integer
        description: Minimum number of beds required
        examples:
          DoubleRoom:
            value: 2
            summary: Double Room
            description: Find accommodations with at least 2 beds
      - in: query
        name: type
        schema:
          type: string
          enum:
          - Flat
          - Mini hall
          - Room
        description: Type of accommodation
        examples:
          FlatType:
            value: Flat
            summary: Flat Type
            description: Search for flats only
      tags:
      - Search
      security:
      - University-API-Key: []
      - University-API-Key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccommodationSearch'
              examples:
                SearchResultExample:
                  value:
                  - id: 1
                    universities:
                    - HKU
                    - CUHK
                    building_name: Ocean Shores
                    type: Flat
                    beds: 2
                    bedrooms: 1
                    price: '1500.00'
                    latitude: 22.123
                    longitude: 114.123
                    address: 123 Sample Street
                    distance: '1.5'
                  summary: Search Result Example
                SearchResults:
                  value:
                  - - id: 1
                      university: HKU
                      building_name: Ocean Shores
                      type: Flat
                      beds: 2
                      bedrooms: 1
                      price: '1500.00'
                      latitude: 22.123
                      longitude: 114.123
                      address: 123 Sample Street
                      distance: '1.5'
                  summary: Search Results
          description: List of accommodations matching the search criteria
        '401':
          description: Authentication failed
