openapi: 3.0.3
info:
  title: UniHaven API
  version: 1.0.0
  description: "\n    API for managing student accommodations across universities.\n\
    \    \n    Authentication:\n    - Use X-University-API-Key header with your university's\
    \ API key\n    - Example: X-University-API-Key: hku-secret-key-2025\n    \n  \
    \  Available API Keys for Testing:\n    - HKU: hku-secret-key-2025\n    - HKUST:\
    \ hkust-secret-key-2025\n    - CUHK: cuhk-secret-key-2025\n    "
paths:
  /api/accommodations/:
    get:
      operationId: accommodations_list
      tags:
      - accommodations
      security:
      - University-API-Key: []
      - University-API-Key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Accommodation'
              examples:
                ResponseExample:
                  value:
                  - id: 1
                    building_name: Ocean Shores Tower 13
                    type: Flat
                    beds: 2
                    bedrooms: 1
                    price: '1500.00'
                    floor_number: '13'
                    flat_number: A
                    room_number: '101'
                    owner_name: John Doe
                    owner_contact: '12345678'
                    availability_start: '2025-06-01'
                    availability_end: '2025-12-31'
                    address: 123 Sample Street
                    latitude: 22.123
                    longitude: 114.123
                    geo_address: Some Geo Address
                    is_reserved: false
                    average_rating: 4.5
                    rating_count: 2
                    university: HKU
                  summary: Response Example
          description: ''
    post:
      operationId: accommodations_create
      tags:
      - accommodations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccommodationRequest'
            examples:
              ValidAccommodationExample:
                value:
                  building_name: Ocean Shores Tower 13
                  type: Flat
                  beds: 2
                  bedrooms: 1
                  price: '1500.00'
                  floor_number: '13'
                  flat_number: A
                  room_number: '101'
                  owner_name: John Doe
                  owner_contact: '12345678'
                  availability_start: '2025-06-01'
                  availability_end: '2025-12-31'
                  address: 123 Sample Street
