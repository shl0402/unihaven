components:
  schemas:
    Accommodation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        universities:
          type: array
          items:
            type: string
        availability_start:
          type: string
          format: date
        availability_end:
          type: string
          format: date
        type:
          $ref: '#/components/schemas/TypeEnum'
        beds:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        bedrooms:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        building_name:
          type: string
          maxLength: 255
        latitude:
          type: number
          format: double
          readOnly: true
        longitude:
          type: number
          format: double
          readOnly: true
        address:
          type: string
        geo_address:
          type: string
          readOnly: true
          nullable: true
        room_number:
          type: string
          nullable: true
          maxLength: 50
        flat_number:
          type: string
          maxLength: 50
        floor_number:
          type: string
          maxLength: 50
        owner_name:
          type: string
          maxLength: 255
        owner_contact:
          type: string
          maxLength: 50
        is_reserved:
          type: boolean
          readOnly: true
        average_rating:
          type: number
          format: double
          readOnly: true
        rating_count:
          type: integer
          readOnly: true
      required:
      - address
      - availability_end
      - availability_start
      - average_rating
      - bedrooms
      - beds
      - building_name
      - flat_number
      - floor_number
      - geo_address
      - id
      - is_reserved
      - latitude
      - longitude
      - owner_contact
      - owner_name
      - price
      - rating_count
      - type
      - universities
